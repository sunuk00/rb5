# Teleop settings for Simulation: the same values as configs/real.yaml (real-1 final, 2026-10-16), so
# practice in Simulation feels like the real robot. Generated from real.yaml; only `mode` and
# `tcp.expected_offset_mm` differ (checked by tests/test_settings.py). Edit real.yaml first.
mode: sim

# robot (ip, speed_bar): configs/robot.yaml, shared with the scripts

servo:                          # same as Simulation (06, 10, 13 Real)
  period_s: 0.02
  t1_s: 0.02
  t2_s: 0.1
  gain: 1.0
  alpha: 1.0

leader:
  port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT62AJW7-if00-port0   # by adapter serial (grip-1: two FTDI adapters); same as scripts/config.py
  required_latency_timer_ms: 1

mapping:
  scale: 1.0                    # was 0.5; user found the real RB5 too slow (2026-10-12). Real max 1.0
  frame_yaw_deg: 0.0            # TBD with the operator position; 0 = leader x forward = RB5 +x
  speed_mm_s: 250.0             # radial / vertical, Real max. 2026-10-16: 200 -> 250 (045859: speed cap 73 % of the
                                # normal mode, 1167 mm dropped there). Before: option B 200 (was 100, 50). Hand faster than 100 in 63 %
                                # of the clutch time, than 200 in 22 % (10-14 Real runs; decisions 2026-10-16)
  speed_tangential_mm_s: 360.0  # sideways about the base z axis (turning J1), Real max. 2026-10-16: 300 -> 360 (J1 a bit
                                # faster; 044916: robot J1 p90 42 deg/s while the hand asked 89). Before that: J1 was
                                # speed-limited 46-59 % of its turning time at 200 (about 25 deg/s at r 450)
  lead_per_step: 2.0
  accel_mm_s2: 2500.0           # target acceleration limit (2026-10-16): the largest joint accelerations came when the
                                # speed / joint limits switched on and off (040257: 97 % / 82 % of the top 1 %); the
                                # hand's own acceleration p99 is about 4 m/s^2. 0 = off
  max_lag_mm: 20.0              # C: catch up to 20 mm after the hand stops (0.08 s at 250 mm/s); was 0 (B)
  leader_deadband_mm: 0.3       # ignore leader wrist center changes < 0.3 mm (encoder flicker, run 141108)
  leader_filter_tau_s: 0.03     # low-pass on the wrist center against the encoder-step jitter that shook the RB5 at
                                # 200 mm/s (20261016_021514); offline: jitter 1.73 -> about 0.6 m/s^2, +30 ms delay
  left_button: rotate           # left handle button held: "rotate" = radius and z fixed, sideways hand motion turns
                                # J1 (user 2026-10-16); "vertical" = x, y fixed, only z follows (straight descents);
                                # "off" = button not read
  rotate_deg_per_mm: 0.3        # rotate: 100 mm of sideways hand motion = 30 deg of J1 (cartesian needed about
                                # 236 mm at r 450)
  rotate_max_lag_deg: 15.0      # rotate: J1 may lag the hand by up to 15 deg and catches up after the hand stops
                                # (041233: 1477 mm dropped while rotating, 4x the normal mode)
  lock_azimuth: true            # without the left button J1 stays (user 2026-10-16; 035549: J1 turned 150 deg in
                                # the normal mode by accident): hand forward / back = along the arm, up / down = z,
                                # sideways not used
  vertical_z_scale: 1.5         # z x 1.5 in the vertical mode (user 2026-10-16: 2.0 was a bit fast; 033917: z speed
                                # median 122 mm/s, 40 % at the 200 mm/s cap). Fewer re-grips than 1.0

yaw:
  mode: follow_base             # user 2026-10-16: RB5 J6 stays still; the tool turns with J1 (leader J6 not used).
                                # "leader_j6" = twist the handle to turn the tool; the values below are used only
                                # in that mode (and leader_deadband_deg for the logged J6)
  enabled: true
  speed_deg_s: 30.0             # was 15. Real max 30
  range_deg: 45.0               # conservative
  max_lag_deg: 0.0              # B
  leader_deadband_deg: 0.15     # ignore leader J6 changes < 0.15 deg: one encoder tick (0.088) back and forth made
                                # the RB5 J6 shake (run 141108); two ticks (0.176) pass

range:                          # absolute in the RB5 base frame (2026-10-16; before: relative to the start pose,
                                # so every ready-pose change moved the range). Same space as before.
  r_min_mm: 250.0               # same as Simulation; the smallest inner radius (z >= 100). Was 350 at every height
  r_min_by_z: [[0.0, 350.0], [50.0, 300.0], [100.0, 250.0]]
                                # [z, r_min] (user, 2026-10-17: closer in): 350 at z <= 0, 300 at z 50, 250 at z >= 100,
                                # linear between. Low down the folded arm brings J3 near its limit (DH IK, ready pose
                                # orientation, 5 mm steps): on this boundary J3 margin >= 16.7 deg (no slowdown, slow < 15),
                                # elbow >= 31.7 deg, shoulder >= 136 mm, J5 >= 86 deg.
                                # The model does not know the robot body: r 250 is close to the base
  r_max_mm: 800.0               # same as Simulation; elbow >= 43 deg up to r 800 (DH grid)
  z_min_mm: -50.0               # TCP never below z -50 (2026-10-16, user: lower; nothing is mounted on the flange,
                                # the TCP is 187 mm below the flange center, so the flange center is at about 140 mm
                                # above the table). Was 30 (provisional). RAISE IT when a tool is mounted:
                                # tool tip height + margin
  z_max_mm: 465.0               # top; the outer radius falls with height above 265:
  r_max_by_z: [[265.0, 800.0], [315.0, 775.0], [365.0, 725.0], [415.0, 700.0], [465.0, 650.0]]
                                # [z, r_max]: largest r without any slowdown at that height (DH grid with the ready
                                # pose orientation, azimuth +/-90; user chose this shape 2026-10-12)
  azimuth_min_deg: -160.0       # 2026-10-16: was -107; 044024 hit -107 (the hand asked 49 deg more), the + side was
                                # used only to +14. The tool turns with J1, so the other joints keep their margins;
                                # J1 spans about 8 .. 301 deg (limit +/-360). Keep that side and the back clear (Real: user)
  azimuth_max_deg: 133.0        # unchanged (was the ready pose of 13.4 deg + 120)

safety:
  joint_speed_deg_per_cycle: [1.5, 1.2, 1.2, 1.2, 1.2, 1.2]   # J1 1.5 = 75 deg/s since 2026-10-16 (J1 a bit
                                # faster in the rotate mode); J2-J6 60 deg/s (user, 2026-10-16, option B; was 0.8,
                                # 0.5). Following the hand needed > 40 deg/s in 35 % and > 60 in 18 % of the clutch
                                # time (estimate, 10-14 runs). TBD from the RB5 specification
  joint_limit_deg: [360.0, 360.0, 165.0, 360.0, 360.0, 360.0] # J3 +/-165 (user checked on the pendant, 2026-10-12)
  joint_limit_slow_deg: 15.0    # was 20 (2026-10-16): the smallest J3 margin anywhere in the range is 16.7 deg (inner low
                                # corner r 350, z -50), so the stop (10) cannot be reached inside the range; 20 slowed
                                # the robot there 19.9 % of the clutch time (043303)
  joint_limit_stop_deg: 10.0
  j5_slow_deg: 20.0
  j5_stop_deg: 10.0
  shoulder_slow_mm: 50.0
  shoulder_stop_mm: 20.0
  elbow_slow_deg: 20.0
  elbow_stop_deg: 10.0
  min_speed_scale: 0.25
  max_fk_error_mm: 5.0
  max_gap_s: 0.03
  max_late_cycles: 3
  max_state_age_s: 0.1
  max_stale_cycles: 3
  max_leader_fails: 3
  hold_on_exit_s: 0.3

tcp:
  expected_offset_mm: null      # not checked in Simulation
  offset_tolerance_mm: 1.0

ready_pose:                     # 2026-10-19 (user): the pose the user set on the real RB5 (read from jnt_ref), with
                                # J6 where the camera on the gripper body sees best and J5 -90.5, so the J6 axis is
                                # vertical within 0.5 deg (tool rpy 89.7, -0.5, 179.2: the gripper hangs straight down).
                                # DH TCP (67.2, -499.4, 144.3): r 504, z 144, azimuth -82.3; room in 254, out 296,
                                # down 194, up 321 mm; margins J5 89.5, shoulder 355 mm, elbow 63.2, J3 limit 48.2 deg.
                                # From the 2026-10-18 pose the move turns J6 +130.7 deg (wrist warning, typed yes).
                                # Before: (85.116, 4.300, -119.566, 31.666, -87.544, 53.521) (2026-10-18, side workspace)
  joints_deg: [84.898, 1.808, -116.764, 24.718, -90.463, -175.743]
  move_speed_deg_s: 50.0        # x speed bar 0.1 = 5 deg/s (was 30 = 3 deg/s; user 2026-10-12: a bit faster)
  tolerance_deg: 0.05
  wrist_warning_deg: 90.0

gripper:                        # same as Simulation. MX-106T on its own U2D2 (grip-1 .. grip-3b, teleop/gripper.py)
  enabled: true                 # the gripper moves in Simulation too; python -m teleop --no-gripper turns it off
  port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT62AJAX-if00-port0   # gripper U2D2; same as scripts/config.py
  trigger: left                 # left handle trigger (like the left button that turns J1)
  trigger_full: 1000.0          # trigger 0 (released) = closed, 1000 (fully pulled) = fully open, in proportion
  closed_ticks: 3968            # measured by hand (grip-2, docs/hardware.md)
  open_ticks: 2196
  goal_current: 200             # x 3.36 mA = 0.67 A force cap (2026-10-19, user: faster start; was 150 = 0.50 A).
                                # In mode 5 it caps the gripping force AND the acceleration: the start was at the cap
  profile_velocity: 210         # x 0.229 rpm = 48.1 rpm = the motor's Velocity Limit (was 200; user 2026-10-17: a bit
                                # faster). At 10.5 V the motor reaches only about 42 rpm: 12 V is the bigger gain
  profile_acceleration: 200     # x 214.577 rev/min^2: 0 -> 48 rpm in about 0.07 s (was 100, 0.13 s; the current
                                # while speeding up was 212-337 mA, below the 504 mA cap, so this limited the start)
  catch_frac: 0.05              # follow once the trigger points within 5 % of the gripper position (or passes it)
  min_voltage: 10.0             # below: warning only during the teleop (turning the torque off drops the object)
  max_temperature: 70           # C; above: the gripper thread stops (the arm continues)
  fail_stop: 3                  # failed gripper reads in a row: the gripper thread stops (the arm continues)

logging:
  dir: data/teleop             # teleop runs only; the scripts write to data/

runtime:
  cpu_cores: [0, 11]            # pin to the performance cores (i7-13700H cpu0-11): planning p99 5-6 ms instead of
                                # 8-9 ms (decisions 2026-10-12); replaces "taskset -c 0-11"; null = no pinning
