# Teleop settings for Simulation (the default). Values are the ones tested with
# scripts/21_leader_rb5_position.py on 2026-10-12 (see docs/decisions.md for each decision).
mode: sim

# robot (ip, speed_bar): configs/robot.yaml, shared with the scripts

servo:                          # move_servo_l arguments (rb_cobot_docs UI Script 7.35)
  period_s: 0.02                # 50 Hz send loop
  t1_s: 0.02                    # equal to the send period (06 / 10)
  t2_s: 0.1
  gain: 1.0
  alpha: 1.0

leader:
  port: /dev/ttyUSB0            # /dev/rby1_leader_arm after the udev rule is installed
  required_latency_timer_ms: 1  # FTDI latency_timer must be 1 ms (11)

mapping:
  scale: 2.0                    # RB5 motion / leader motion; 1.5 so the RB5 reaches farther (user, 2026-10-12) <-- 여기를 바꾸면 RB5의 움직임이 leader의 움직임에 비례하여 더 커지거나 작아짐
  frame_yaw_deg: 0.0            # leader frame rotated about z before mapping
  speed_mm_s: 400.0             # TCP speed limit; 200 dropped 1.8-4.0 m of hand motion per run at scale 1.5-2 (130330, 130757)
  lead_per_step: 2.0            # target may lead tcp_ref by this x one step
  max_lag_mm: 50.0              # C: lag kept for catch-up; 0 = B (was 30; 50 is the settings maximum)
  leader_deadband_mm: 0.3       # ignore leader wrist center changes < 0.3 mm (encoder flicker, run 141108)
  leader_filter_tau_s: 0.03     # low-pass on the wrist center against the encoder-step jitter that shook the RB5 at
                                # 200 mm/s (20261016_021514); offline: jitter 1.73 -> about 0.6 m/s^2, +30 ms delay
  mode: cartesian               # "cylindrical" (a hand swing about the pivot turns J1 by the same angle) was tried on
                                # 2026-10-16 (031043): J1 easier, but it felt worse and hit the speed cap 65 % of the time
  pivot_xy_mm: [0.0, 0.0]       # leader base center: hand 205 mm or more from it in 95 % of the clutch time (right
                                # shoulder (0, -150): 87 mm), sideways gain about 1.6x median (shoulder 2.3x)
  min_pivot_radius_mm: 150.0    # angle = sideways motion / max(hand radius, 150): bounded gain near the axis
  vertical_button: true         # left handle button held: x, y fixed, only z follows (straight descents for pick
                                # and place: the hand drifts back 0.5-0.9 x the descent, mostly from the elbow)
  vertical_z_scale: 2.0         # z x 2 in the vertical mode (user trial 2026-10-16): fewer re-grips on long descents
                                # (032657: 57 clutch presses, half shorter than 1 s)

yaw:                            # RB5 yaw change = leader J6 change (method B)
  enabled: true
  speed_deg_s: 90.0
  range_deg: 90.0               # around the TCP rz at start
  max_lag_deg: 15.0             # C lag for yaw (forced to 0 when max_lag_mm is 0)
  leader_deadband_deg: 0.15     # ignore leader J6 changes < 0.15 deg: one encoder tick (0.088) back and forth made
                                # the RB5 J6 shake (run 141108); two ticks (0.176) pass

range:                          # cylinder piece about the base z axis, fixed at start (ready pose: r 500, z 200)
  r_min_mm: 350.0               # J3 (+/-165) margin >= 10 deg over the range (DH grid, 2026-10-12)
  r_max_mm: 800.0               # was 600 (x stopped at about 585); elbow >= 43 deg up to r 800 (DH grid, z -37..213,
                                # azimuth +/-30); x 750 needs r 771 at the start azimuth 13.4 deg
  z_below_mm: 237.0             # start z (about 202) - 237 = about -35 mm, the same floor as before (was 100 from 64.6)
  z_above_mm: 263.0             # start z + 263 (about 465 mm, same top as before); was 400 from start z 64.6
  r_max_by_z: [[63.0, 800.0], [113.0, 775.0], [163.0, 725.0], [213.0, 700.0], [263.0, 650.0]]
                                # [start z + dz, r_max]: largest r without any slowdown at that height (DH grid
                                # with the ready pose orientation, azimuth +/-90; user chose this shape 2026-10-12).
                                # dz moved down by 137 mm with the new ready pose (2026-10-16): same absolute
                                # heights (about 265 .. 465 mm) as before
  z_min_abs_mm: null            # absolute floor; null = not used in Simulation
  azimuth_half_deg: 90.0

safety:
  joint_speed_deg_per_cycle: [1.0, 1.0, 1.0, 2.0, 2.0, 2.0]   # predicted, J1..J6 (wrist 2)
  joint_limit_deg: [360.0, 360.0, 165.0, 360.0, 360.0, 360.0] # J3 +/-165 (user checked on the pendant, 2026-10-12)
  joint_limit_slow_deg: 20.0
  joint_limit_stop_deg: 10.0
  j5_slow_deg: 20.0             # wrist singularity (J5 from 0 / 180)
  j5_stop_deg: 10.0
  shoulder_slow_mm: 50.0        # shoulder singularity (P05 radius - d4)
  shoulder_stop_mm: 20.0
  elbow_slow_deg: 20.0          # elbow singularity (J3 from 0 / 180)
  elbow_stop_deg: 10.0
  min_speed_scale: 0.25         # speed scale at the stop thresholds
  max_fk_error_mm: 5.0          # DH model vs tcp_ref at start (17: about 2 mm)
  max_gap_s: 0.03               # send gap over this = late, target frozen (08)
  max_late_cycles: 3
  max_state_age_s: 0.1
  max_stale_cycles: 3
  max_leader_fails: 3
  hold_on_exit_s: 0.3

tcp:
  expected_offset_mm: null      # null = not checked in Simulation
  offset_tolerance_mm: 1.0

ready_pose:                     # 2026-10-16: r 500, z 200 (DH), tool and azimuth as the user's 2026-10-12 pose
                                # (178.969, 8.514, -138.775, 46.535, -87.239, 56.265; r 367). Pose D was
                                # (182, -11, -110.1, 31.1, -90, -2)
  joints_deg: [182.920, -0.156, -107.813, 24.418, -87.677, 52.334]
  move_speed_deg_s: 30.0        # move_j argument; x speed bar 0.1 = 3 deg/s
  tolerance_deg: 0.05           # closer than this on every joint: no move
  wrist_warning_deg: 90.0       # warn when a wrist joint turns more than this

gripper:                        # grip_close = 1 - trigger / trigger_full (trigger: pulled 0, released 1000)
  trigger_full: 1000.0
  close_above: 0.6
  open_below: 0.4
  fail_warn: 3

logging:
  dir: data/teleop             # teleop runs only; the scripts write to data/

runtime:
  cpu_cores: [0, 11]            # pin to the performance cores (i7-13700H cpu0-11): planning p99 5-6 ms instead of
                                # 8-9 ms (decisions 2026-10-12); replaces "taskset -c 0-11"; null = no pinning
