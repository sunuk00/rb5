# Teleop settings for the REAL robot. Conservative starting values; nothing here has been run on the
# real robot yet. Each value says where it comes from, or TBD. Keys set to null are TBD and the
# teleop refuses to start in Real until they are filled in (see docs/real_first_run_checklist.md).
# 2026-10-12: provisional values for a first Real test (user request): z floor and TCP offset are
# placeholders marked PROVISIONAL, to be replaced by table height + gripper length and the lab's TCP.
mode: real

# robot (ip, speed_bar): configs/robot.yaml, shared with the scripts

servo:                          # same as Simulation (06, 10, 13 Real)
  period_s: 0.02
  t1_s: 0.02
  t2_s: 0.1
  gain: 1.0
  alpha: 1.0

leader:
  port: /dev/ttyUSB0            # /dev/rby1_leader_arm once the udev rule is installed (not yet)
  required_latency_timer_ms: 1

mapping:
  scale: 1.0                    # was 0.5; user found the real RB5 too slow (2026-10-12). Real max 1.0
  frame_yaw_deg: 0.0            # TBD with the operator position; 0 = leader x forward = RB5 +x
  speed_mm_s: 200.0             # Real max (user, 2026-10-16, option B); was 100, 50. Hand faster than 100 in 63 %
                                # of the clutch time, than 200 in 22 % (10-14 Real runs; decisions 2026-10-16)
  lead_per_step: 2.0
  max_lag_mm: 20.0              # C: catch up to 20 mm after the hand stops (0.1 s at 200 mm/s); was 0 (B). Yaw stays B
                                # because yaw.max_lag_deg is 0
  leader_deadband_mm: 0.3       # ignore leader wrist center changes < 0.3 mm (encoder flicker, run 141108)
  leader_filter_tau_s: 0.03     # low-pass on the wrist center against the encoder-step jitter that shook the RB5 at
                                # 200 mm/s (20261016_021514); offline: jitter 1.73 -> about 0.6 m/s^2, +30 ms delay

yaw:
  enabled: true
  speed_deg_s: 30.0             # was 15. Real max 30
  range_deg: 45.0               # conservative
  max_lag_deg: 0.0              # B
  leader_deadband_deg: 0.15     # ignore leader J6 changes < 0.15 deg: one encoder tick (0.088) back and forth made
                                # the RB5 J6 shake (run 141108); two ticks (0.176) pass

range:
  r_min_mm: 350.0               # same as Simulation (user, 2026-10-12); was 340..420
  r_max_mm: 800.0               # same as Simulation; elbow >= 43 deg up to r 800 (DH grid)
  z_below_mm: 172.0             # start z (about 202) - 172 = 30 = the floor below; was 100 from start z 64.6
  z_above_mm: 263.0             # start z + 263 (about 465 mm, same top as before); was 400 from start z 64.6
  r_max_by_z: [[63.0, 800.0], [113.0, 775.0], [163.0, 725.0], [213.0, 700.0], [263.0, 650.0]]
                                # [start z + dz, r_max]: largest r without any slowdown at that height (DH grid
                                # with the ready pose orientation, azimuth +/-90; user chose this shape 2026-10-12).
                                # dz moved down by 137 mm with the new ready pose (2026-10-16): same absolute
                                # heights (about 265 .. 465 mm) as before
  z_min_abs_mm: 30.0            # PROVISIONAL: TCP never below z 30 mm (z 0 = base bottom = table?). Replace with
                                # table height + gripper length + margin
  azimuth_half_deg: 90.0        # same as Simulation; was 30

safety:
  joint_speed_deg_per_cycle: [1.2, 1.2, 1.2, 1.2, 1.2, 1.2]   # 60 deg/s = Real max (user, 2026-10-16, option B; was
                                # 0.8, 0.5). Following the hand needed > 40 deg/s in 35 % and > 60 in 18 % of the
                                # clutch time (estimate, 10-14 runs). TBD from the RB5 specification
  joint_limit_deg: [360.0, 360.0, 165.0, 360.0, 360.0, 360.0] # J3 +/-165 (user checked on the pendant, 2026-10-12)
  joint_limit_slow_deg: 20.0
  joint_limit_stop_deg: 10.0
  j5_slow_deg: 20.0
  j5_stop_deg: 10.0
  shoulder_slow_mm: 50.0
  shoulder_stop_mm: 20.0
  elbow_slow_deg: 20.0
  elbow_stop_deg: 10.0
  min_speed_scale: 0.25
  max_fk_error_mm: 5.0
  max_gap_s: 0.03
  max_late_cycles: 3
  max_state_age_s: 0.1
  max_stale_cycles: 3
  max_leader_fails: 3
  hold_on_exit_s: 0.3

tcp:
  expected_offset_mm: [0.0, -187.0, -40.0]   # PROVISIONAL: the offset set on the controller now (17); the start
                                # refuses if it changes. The lab is checking what it should be
  offset_tolerance_mm: 1.0

ready_pose:
  joints_deg: [182.920, -0.156, -107.813, 24.418, -87.677, 52.334]   # 2026-10-16: r 500, z 200 (DH), same tool
                                # orientation and azimuth as the pose set by the user on 2026-10-12 (178.969, 8.514,
                                # -138.775, 46.535, -87.239, 56.265; r 367 was only 17 mm from r_min, so descents
                                # stopped at r_min). DH TCP (486.5, 115.5, 200.0); controller FK about 2 mm higher
  move_speed_deg_s: 50.0        # x speed bar 0.1 = 5 deg/s (was 30 = 3 deg/s; user 2026-10-12: a bit faster)
  tolerance_deg: 0.05
  wrist_warning_deg: 90.0

gripper:                        # same as Simulation: grip_close = 1 - trigger / trigger_full
  trigger_full: 1000.0
  close_above: 0.6
  open_below: 0.4
  fail_warn: 3

logging:
  dir: data/teleop             # teleop runs only; the scripts write to data/

runtime:
  cpu_cores: [0, 11]            # pin to the performance cores (i7-13700H cpu0-11): planning p99 5-6 ms instead of
                                # 8-9 ms (decisions 2026-10-12); replaces "taskset -c 0-11"; null = no pinning
